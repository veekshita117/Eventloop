name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend CI (.NET 8 & Azure Functions)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/Eventloop.sln

      - name: Build Solution
        run: dotnet build backend/Eventloop.sln --no-restore -c Release

      - name: Run Backend Tests with Code Coverage
        run: >
          dotnet test backend/Eventloop.Tests/Eventloop.Tests.csproj
          --no-build
          -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ./TestResults

  frontend:
    name: Frontend CI (React, TypeScript & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
